<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Финансы — Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tailwind-script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    button, input, .tab-btn { touch-action: manipulation; }
  </style>
<base target="_blank">
</head>

<body class="bg-gradient-to-br from-violet-600 to-indigo-600 min-h-[100dvh] flex items-center justify-center p-3 md:p-4">
  <div class="max-w-md w-full">
    <div class="glass rounded-3xl shadow-2xl p-6 md:p-10">
      <div class="flex justify-center mb-4 md:mb-6">
        <div class="w-16 h-16 md:w-20 md:h-20 bg-white/10 rounded-3xl flex items-center justify-center text-4xl md:text-6xl">💰</div>
      </div>
      <h1 class="text-white text-3xl md:text-4xl font-bold text-center mb-2">Мир финансов</h1>
      <p class="text-white/80 text-center mb-6 md:mb-8 text-sm md:text-base">Учёт • Бюджет • Цели</p>

      <div class="flex bg-white/10 rounded-3xl p-1.5 mb-6 md:mb-8">
        <button id="tabLogin"
          class="flex-1 py-3 md:py-4 text-base md:text-lg font-semibold rounded-3xl tab-btn active text-white">Вход</button>
        <button id="tabRegister"
          class="flex-1 py-3 md:py-4 text-base md:text-lg font-semibold rounded-3xl tab-btn text-white">Регистрация</button>
      </div>

      <form id="loginForm" class="space-y-4 md:space-y-5">
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="off"
          class="w-full bg-white/10 border border-white/30 text-white placeholder-white/70 rounded-3xl px-5 md:px-6 py-3 md:py-4 text-base md:text-lg">
        <div class="relative">
          <input type="password" id="loginPassword" placeholder="Пароль" required autocomplete="new-password"
            class="w-full bg-white/10 border border-white/30 text-white placeholder-white/70 rounded-3xl px-5 md:px-6 py-3 md:py-4 pr-12 text-base md:text-lg">
          <button type="button" onclick="togglePassword('loginPassword')"
            class="absolute right-4 md:right-5 top-1/2 -translate-y-1/2 text-white/70 text-lg md:text-xl p-2">
            <i id="loginEye" class="fas fa-eye"></i>
          </button>
        </div>
        <button type="submit"
          class="w-full bg-white text-violet-700 font-semibold py-3 md:py-4 rounded-3xl text-lg md:text-xl active:scale-[0.98] transition-transform">Войти</button>
      </form>

      <form id="registerForm" class="space-y-4 md:space-y-5 hidden">
        <input type="text" id="regName" placeholder="Имя" required autocomplete="off"
          class="w-full bg-white/10 border border-white/30 text-white placeholder-white/70 rounded-3xl px-5 md:px-6 py-3 md:py-4 text-base md:text-lg">
        <input type="email" id="regEmail" placeholder="Email" required autocomplete="off"
          class="w-full bg-white/10 border border-white/30 text-white placeholder-white/70 rounded-3xl px-5 md:px-6 py-3 md:py-4 text-base md:text-lg">
        <div class="relative">
          <input type="password" id="regPassword" placeholder="Пароль (минимум 6)" required autocomplete="new-password"
            class="w-full bg-white/10 border border-white/30 text-white placeholder-white/70 rounded-3xl px-5 md:px-6 py-3 md:py-4 pr-12 text-base md:text-lg">
          <button type="button" onclick="togglePassword('regPassword')"
            class="absolute right-4 md:right-5 top-1/2 -translate-y-1/2 text-white/70 text-lg md:text-xl p-2">
            <i id="regEye" class="fas fa-eye"></i>
          </button>
        </div>
        <button type="submit"
          class="w-full bg-white text-violet-700 font-semibold py-3 md:py-4 rounded-3xl text-lg md:text-xl active:scale-[0.98] transition-transform">Создать
          аккаунт</button>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-4 right-4 flex flex-col gap-3 z-50"></div>
  <script src="scripts/auth.js"></script>
</body>

</html>
